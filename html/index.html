<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mani</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #e2e8f0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            text-align: center;
            padding: 3rem;
            background: rgba(255,255,255,0.05);
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            max-width: 600px;
        }
        h1 {
            font-size: 2.5rem;
            background: linear-gradient(90deg, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }
        .course { color: #94a3b8; font-size: 1.1rem; margin-bottom: 2rem; }
        .team-section h2 { color: #38bdf8; font-size: 1.3rem; margin-bottom: 1rem; }
        .member {
            padding: 0.75rem 1.5rem;
            margin: 0.5rem 0;
            background: rgba(56, 189, 248, 0.1);
            border-radius: 8px;
            border-left: 3px solid #38bdf8;
        }
        .member span { color: #94a3b8; font-size: 0.9rem; }
        footer { margin-top: 2rem; color: #475569; font-size: 0.85rem; }
    </style>
</head>
<body>
<div class="container">
    <h1>Team NN</h1>
    <p class="course">Pay the World whatever it takes to let you think alone</p>
    <div class="team-section">
        <h2>Never give up</h2>
        <div class="member">
            <strong>MANIII</strong><br>
            <span>!!!</span>
        </div>
    </div>
    <footer>
        <p>Served by Caddy | Deployed on Kubernetes</p>
    </footer>
</div>
</body>
</html>
